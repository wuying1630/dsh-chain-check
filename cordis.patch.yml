# dsh-chain-check —— bundle patch
#
# 装上之后，profile 只要在 dsh.profile.bundles 里列出本包名即生效：
#   dsh plugin --profile desktop add github:wuying1630/dsh-chain-check
#
# 装上会发生什么：往会话里多一个 chain_check 工具。就这一件事，不碰别的配置、
# 不常驻、不改任何文件。命令行那条 `node check.mjs` 不装插件也能单独跑。

- insert:
    - id: chain-check
      name: dsh-chain-check
